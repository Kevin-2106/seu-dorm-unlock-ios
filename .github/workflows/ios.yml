name: Build iOS (ad-hoc signed ipa)

# 只手动触发或打 tag：macOS runner 分钟数较贵，不挂普通 push 自动触发。
#   手动: `gh workflow run ios.yml` 或在 Actions 页面点 "Run workflow"
#   发布: 推送形如 v1.0.0 的 tag，构建后自动创建 Release 并挂上 .ipa
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 切换到最新可用 Xcode (XcodeGen 生成的项目格式可能比默认 Xcode 新)
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: 协议层单元测试 (Crypto.swift，与上游 Kotlin 测试向量比对)
        working-directory: ios/DoorUnlock
        run: swift test

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        working-directory: ios/DoorUnlock
        run: xcodegen generate

      - name: 构建 (真机架构，不签名)
        working-directory: ios/DoorUnlock
        run: |
          set -o pipefail
          COMMIT=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0"
          fi
          # 构建号用 UTC 时间戳 (YYMMDDHHmm)，单调递增，不依赖仓库/工作流的 run 编号，
          # 避免 SideStore 因为"新版 build 号比已装的小"而拒绝覆盖安装。
          BUILD=$(date -u +%y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "version=$VERSION build号=$BUILD commit=$COMMIT"
          xcodebuild -project DoorUnlock.xcodeproj \
            MARKETING_VERSION=$VERSION \
            CURRENT_PROJECT_VERSION=$BUILD \
            BUILD_COMMIT=$COMMIT \
            -scheme DoorUnlock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== 构建失败，日志末尾 300 行 ====="
            tail -300 build.log
            exit $STATUS
          fi

      - name: 用 codesign 命令行工具手动 ad-hoc 签名，嵌入 NFC entitlements
        working-directory: ios/DoorUnlock
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DoorUnlock.app" -path "*Release-iphoneos*" | head -1)
          echo "APP_PATH=$APP_PATH"
          # 由内向外签: 先签小组件扩展 (不带 NFC entitlement)，最后签主 app 并嵌入 NFC entitlement。
          # 不用 --deep: 它会把同一份 entitlements 套到嵌套的扩展上。
          if [ -d "$APP_PATH/PlugIns" ]; then
            for APPEX in "$APP_PATH"/PlugIns/*.appex; do
              echo "签名扩展: $APPEX"
              codesign --force --sign - "$APPEX"
            done
          fi
          codesign --force --sign - \
            --entitlements Sources/DoorUnlock.entitlements \
            "$APP_PATH"
          echo "===== 内含扩展 ====="
          ls "$APP_PATH/PlugIns" 2>&1 || echo "(没有 PlugIns — 小组件没被嵌进来!)"
          echo "===== 主 app 签名里的 entitlements ====="
          codesign -d --entitlements :- "$APP_PATH"
          echo "===== 校验签名完整性 ====="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "(verify 失败，继续打包，TrollStore/SideStore 会重签)"

      - name: 打包为 ipa (交给越狱机 TrollStore 侧载)
        working-directory: ios/DoorUnlock
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DoorUnlock.app" -path "*Release-iphoneos*" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr DoorUnlock-adhoc.ipa Payload
          ls -la DoorUnlock-adhoc.ipa
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp DoorUnlock-adhoc.ipa "DoorUnlock-${GITHUB_REF_NAME}.ipa"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DoorUnlock-adhoc-ipa
          path: ios/DoorUnlock/DoorUnlock-adhoc.ipa
          if-no-files-found: error

      # 推送 v* tag 时，把带版本号的 .ipa 发布到 Releases
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/DoorUnlock/DoorUnlock-${{ github.ref_name }}.ipa
          generate_release_notes: true
          body: |
            ad-hoc 签名的 `.ipa`，用 TrollStore / SideStore 安装。安装与使用见 [README](https://github.com/${{ github.repository }}#安装)。

            - NFC 开门需要 TrollStore / 越狱 / 付费开发者账号；SideStore + 免费 Apple ID 只能用蓝牙。
            - 构建号 ${{ env.BUILD_NUMBER }}，commit `${{ github.sha }}`。

      # 更新 SideStore 源: source 分支上的 apps.json。用户在 SideStore 里添加
      #   https://raw.githubusercontent.com/<owner>/<repo>/source/apps.json
      # 就能收到更新。放在单独分支上，不污染 main 的提交历史。
      - name: 更新 SideStore 源 (source 分支)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SIZE=$(stat -f%z "ios/DoorUnlock/DoorUnlock-${TAG}.ipa")
          SCRIPT="$GITHUB_WORKSPACE/scripts/make_source.py"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -rf /tmp/source-branch && mkdir /tmp/source-branch && cd /tmp/source-branch
          if git ls-remote --exit-code --heads "$URL" source >/dev/null 2>&1; then
            git clone --quiet --branch source --single-branch "$URL" .
          else
            git init -q -b source
            git remote add origin "$URL"
          fi
          python3 "$SCRIPT" --repo "$REPO" --tag "$TAG" --build "$BUILD_NUMBER" --size "$SIZE" --out apps.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -qm "source: ${TAG} (build ${BUILD_NUMBER})"
          git push -q origin source
