name: Build iOS (ad-hoc signed ipa)

# 只手动触发：macOS runner 分钟数较贵，不挂 push 自动触发，
# 需要联调时用 `gh workflow run ios.yml` 或在 Actions 页面点 "Run workflow"。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 切换到最新可用 Xcode (XcodeGen 生成的项目格式可能比默认 Xcode 新)
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        working-directory: ios/DoorUnlock
        run: xcodegen generate

      - name: 构建 (真机架构，不签名)
        working-directory: ios/DoorUnlock
        run: |
          set -o pipefail
          COMMIT=$(git rev-parse --short HEAD)
          echo "build号=${{ github.run_number }} commit=$COMMIT"
          xcodebuild -project DoorUnlock.xcodeproj \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            BUILD_COMMIT=$COMMIT \
            -scheme DoorUnlock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== 构建失败，日志末尾 300 行 ====="
            tail -300 build.log
            exit $STATUS
          fi

      - name: 用 codesign 命令行工具手动 ad-hoc 签名，嵌入 NFC entitlements
        working-directory: ios/DoorUnlock
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DoorUnlock.app" -path "*Release-iphoneos*" | head -1)
          echo "APP_PATH=$APP_PATH"
          # 由内向外签: 先签小组件扩展 (不带 NFC entitlement)，最后签主 app 并嵌入 NFC entitlement。
          # 不用 --deep: 它会把同一份 entitlements 套到嵌套的扩展上。
          if [ -d "$APP_PATH/PlugIns" ]; then
            for APPEX in "$APP_PATH"/PlugIns/*.appex; do
              echo "签名扩展: $APPEX"
              codesign --force --sign - "$APPEX"
            done
          fi
          codesign --force --sign - \
            --entitlements Sources/DoorUnlock.entitlements \
            "$APP_PATH"
          echo "===== 内含扩展 ====="
          ls "$APP_PATH/PlugIns" 2>&1 || echo "(没有 PlugIns — 小组件没被嵌进来!)"
          echo "===== 主 app 签名里的 entitlements ====="
          codesign -d --entitlements :- "$APP_PATH"
          echo "===== 校验签名完整性 ====="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "(verify 失败，继续打包，TrollStore/SideStore 会重签)"

      - name: 打包为 ipa (交给越狱机 TrollStore 侧载)
        working-directory: ios/DoorUnlock
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DoorUnlock.app" -path "*Release-iphoneos*" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr DoorUnlock-adhoc.ipa Payload
          ls -la DoorUnlock-adhoc.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DoorUnlock-adhoc-ipa
          path: ios/DoorUnlock/DoorUnlock-adhoc.ipa
          if-no-files-found: error
